name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly, so new RustSec advisories surface without a push
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned deliberately: a floating `stable` silently changes the active
      # lint set from under `-D warnings` whenever a new Rust version ships,
      # which makes clippy failures non-deterministic across runs. Bumping
      # this is a normal maintenance PR, not an emergency fix.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Format
        run: cargo fmt --all -- --check
        working-directory: src-tauri
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - name: Tests
        run: cargo test
        working-directory: src-tauri
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
          # Advisory-specific ignores only, each with a reason below. A new
          # advisory not listed here still fails the job.
          #
          # RUSTSEC-2026-0194 / RUSTSEC-2026-0195 (quick-xml, quadratic-time and
          # unbounded-allocation DoS while parsing XML): transitive through
          # tauri -> plist -> quick-xml, used only to read/write napm's own
          # macOS Info.plist bundle metadata. napm never feeds it
          # attacker-controlled XML. Revisit when Tauri/plist bump quick-xml
          # to >=0.41.0.
          # RUSTSEC-2026-0235 (rkyv, insufficient archive validation can cause
          # out-of-bounds reads): transitive through tauri-utils -> byte-unit
          # -> rust_decimal -> rkyv, used only for byte-unit's numeric size
          # formatting. napm never deserializes rkyv archives. Revisit when
          # Tauri bumps byte-unit/rust_decimal past rkyv >=0.8.17.
          ignore: "RUSTSEC-2026-0194,RUSTSEC-2026-0195,RUSTSEC-2026-0235"
