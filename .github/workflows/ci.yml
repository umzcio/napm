name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly, so new RustSec advisories surface without a push
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned deliberately: a floating `stable` silently changes the active
      # lint set from under `-D warnings` whenever a new Rust version ships,
      # which makes clippy failures non-deterministic across runs. Bumping
      # this is a normal maintenance PR, not an emergency fix.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Format
        run: cargo fmt --all -- --check
        working-directory: src-tauri
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - name: Tests
        run: cargo test
        working-directory: src-tauri
  audit:
    runs-on: ubuntu-latest
    # rustsec/audit-check needs `checks: write` to publish its result via the
    # GitHub Checks API (POST /repos/.../check-runs). Without it the call
    # fails with "Resource not accessible by integration".
    #
    # Why this only showed up on push, not on pull_request: the action's own
    # pass/fail logic already excludes informational advisories (unmaintained,
    # unsound, notice) from failing the check - only a real, non-informational
    # vulnerability is supposed to fail it. But that logic only runs *after*
    # the Checks API call succeeds. On a `pull_request` event, GitHub sets the
    # `GITHUB_HEAD_REF` env var, and the action treats a failed Checks API
    # call on that event as "this must be a forked PR without Checks access"
    # and falls back to a plain log report, still gated on real vulnerabilities
    # only. On a `push` event `GITHUB_HEAD_REF` is unset, so that fallback
    # never triggers: the Checks API failure itself is fatal and fails the
    # whole job, regardless of whether what triggered a report was a real
    # vulnerability or just an informational notice. This repo's default
    # workflow token permission is read-only (Settings > Actions > General),
    # so the `checks: write` grant below is required, not optional.
    #
    # Setting `permissions:` here narrows the token to just what's listed, so
    # `contents: read` is included explicitly for actions/checkout.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
          # Advisory-specific ignores only, each with a reason below. A new
          # advisory not listed here still fails the job (real vulnerabilities
          # always fail; see the `permissions:` comment above for why that
          # used to also happen for informational-only findings on push).
          #
          # RUSTSEC-2026-0194 / RUSTSEC-2026-0195 (quick-xml, quadratic-time and
          # unbounded-allocation DoS while parsing XML): transitive through
          # tauri -> plist -> quick-xml, used only to read/write napm's own
          # macOS Info.plist bundle metadata. napm never feeds it
          # attacker-controlled XML. Revisit when Tauri/plist bump quick-xml
          # to >=0.41.0.
          # RUSTSEC-2026-0235 (rkyv, insufficient archive validation can cause
          # out-of-bounds reads): transitive through tauri-utils -> byte-unit
          # -> rust_decimal -> rkyv, used only for byte-unit's numeric size
          # formatting. napm never deserializes rkyv archives. Revisit when
          # Tauri bumps byte-unit/rust_decimal past rkyv >=0.8.17.
          ignore: "RUSTSEC-2026-0194,RUSTSEC-2026-0195,RUSTSEC-2026-0235"
