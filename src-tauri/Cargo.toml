[package]
name = "napm"
version = "0.1.9"
description = "napm: a desktop package manager for command-line dev tools"
authors = ["umzcio <umzcio@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/umzcio/napm"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "napm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
ureq = "2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-updater = "2.10.1"

# napm has no unsafe code; keep it that way. Tests inject env values through
# parameters instead of calling the (unsafe) std::env::set_var.
[lints.rust]
unsafe_code = "forbid"

# Lints beyond clippy's defaults that the code is already clean against. CI
# runs clippy with `-D warnings`, so "warn" here fails the build on regression.
[lints.clippy]
assigning_clones = "warn"
format_push_string = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
map_unwrap_or = "warn"
redundant_clone = "warn"
redundant_closure_for_method_calls = "warn"
ref_option = "warn"

[dev-dependencies]
minisign-verify = "0.2.5"
proptest = { version = "1", default-features = false, features = ["std"] }
